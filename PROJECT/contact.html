<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111c">
  <title>Contact — Hello, World!</title>
  <style>
    :root { color-scheme: dark; --ink:#f8f7ff; --muted:#b7b5ca; --purple:#b89aff; --cyan:#81e8e2; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; overflow-x:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 18% 20%,#423073 0,transparent 36%),radial-gradient(ellipse at 84% 78%,#174d59 0,transparent 34%),#10111c; }
    main { width:min(90vw,760px); padding:clamp(2.5rem,8vw,5.5rem) clamp(1.5rem,7vw,5rem); text-align:center; border:1px solid rgb(255 255 255 / 13%); border-radius:2rem; background:linear-gradient(145deg,rgb(255 255 255 / 10%),rgb(255 255 255 / 3%)); box-shadow:0 30px 100px rgb(0 0 0 / 35%),inset 0 1px rgb(255 255 255 / 12%); backdrop-filter:blur(18px); animation:arrive 800ms cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { color:var(--cyan); font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:1rem 0; font-size:clamp(2.8rem,9vw,5.5rem); line-height:1; letter-spacing:-.07em; background:linear-gradient(110deg,#fff 15%,var(--purple) 55%,var(--cyan)); color:transparent; background-clip:text; -webkit-background-clip:text; }
    p { max-width:35rem; margin:1rem auto 0; color:var(--muted); font-size:clamp(1rem,2.5vw,1.15rem); line-height:1.8; }
    .email { display:inline-block; margin-top:1.6rem; padding:.85rem 1.2rem; color:var(--ink); text-decoration:none; border:1px solid rgb(129 232 226 / 45%); border-radius:999px; background:rgb(129 232 226 / 8%); transition:background .2s,transform .2s; }
    .email:hover,.email:focus-visible { background:rgb(129 232 226 / 17%); transform:translateY(-2px); outline:none; }
    nav { display:flex; justify-content:center; gap:.75rem; margin-top:2.2rem; flex-wrap:wrap; }
    nav a { padding:.7rem 1rem; color:var(--ink); text-decoration:none; font-size:.9rem; border:1px solid rgb(255 255 255 / 15%); border-radius:999px; background:rgb(255 255 255 / 5%); transition:background .2s,border-color .2s,transform .2s; }
    nav a:hover,nav a:focus-visible { background:rgb(184 154 255 / 18%); border-color:var(--purple); transform:translateY(-2px); outline:none; }
    @keyframes arrive { from { opacity:0; transform:translateY(20px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Say hello</div>
    <h1>Contact</h1>
    <p>Have a thought, a question, or an idea to share? I’d love to hear from you.</p>
    <a class="email" href="mailto:hello@example.com">✉ &nbsp; hello@example.com</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </main>
</body>
</html>
