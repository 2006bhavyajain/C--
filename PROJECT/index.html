<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111c">
  <meta name="description" content="A little hello from the web.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --muted: #b7b5ca;
      --purple: #b89aff;
      --cyan: #81e8e2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 18% 20%, #423073 0, transparent 36%),
        radial-gradient(ellipse at 84% 78%, #174d59 0, transparent 34%),
        #10111c;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 34rem;
      aspect-ratio: 1;
      border: 1px solid rgb(255 255 255 / 8%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -23rem; right: -9rem; box-shadow: 0 0 0 3rem rgb(255 255 255 / 2%), 0 0 0 6rem rgb(255 255 255 / 2%); }
    body::after { bottom: -27rem; left: -14rem; width: 42rem; box-shadow: 0 0 0 3rem rgb(255 255 255 / 2%), 0 0 0 6rem rgb(255 255 255 / 2%); }
    main {
      width: min(90vw, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 2rem;
      background: linear-gradient(145deg, rgb(255 255 255 / 10%), rgb(255 255 255 / 3%));
      box-shadow: 0 30px 100px rgb(0 0 0 / 35%), inset 0 1px rgb(255 255 255 / 12%);
      backdrop-filter: blur(18px);
      animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both;
    }
    .sparkle { display: inline-block; margin-bottom: 1.2rem; font-size: 2.3rem; filter: drop-shadow(0 0 18px #b89aff); animation: float 3s ease-in-out infinite; }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: .98;
      letter-spacing: -.075em;
      background: linear-gradient(110deg, #fff 15%, var(--purple) 55%, var(--cyan));
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }
    p { margin: 1.4rem 0 0; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }
    .rule { width: 3.5rem; height: 2px; margin: 2rem auto 0; border: 0; background: linear-gradient(90deg, var(--purple), var(--cyan)); border-radius: 2px; }
    .caption { margin-top: 1.2rem; font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: #858399; }
    nav { display: flex; justify-content: center; gap: .75rem; margin-top: 2rem; flex-wrap: wrap; }
    nav a { padding: .7rem 1rem; color: var(--ink); text-decoration: none; font-size: .9rem; border: 1px solid rgb(255 255 255 / 15%); border-radius: 999px; background: rgb(255 255 255 / 5%); transition: background .2s, border-color .2s, transform .2s; }
    nav a:hover, nav a:focus-visible { background: rgb(184 154 255 / 18%); border-color: var(--purple); transform: translateY(-2px); outline: none; }
    @keyframes arrive { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 50% { transform: translateY(-7px) rotate(7deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <span class="sparkle" aria-hidden="true">✦</span>
    <h1>Hello,<br>World!</h1>
    <p>A small beginning, with a little extra sparkle.</p>
    <hr class="rule">
    <div class="caption">Made for the web</div>
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>
</body>
</html>
